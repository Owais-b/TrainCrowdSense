<!DOCTYPE html>
<html>

<head>

    <title>Train CrowdSense Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-5">

        🚆 Train CrowdSense Dashboard

    </h1>

    <div class="row">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3>People Count</h3>

                    <h1 id="count">0</h1>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3>Status</h3>

                    <h1 id="status">

                        SAFE

                    </h1>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
